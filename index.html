<!DOCTYPE html>
<html lang="en" class="staticrypt-html">
<head>
<meta charset="utf-8">
<title>Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="cache-control" content="no-cache">
<link rel="stylesheet" href="https://use.typekit.net/sim0mhf.css">
<style>
:root{--bg:#F2F2F2;--ink:#3A3A3A;--muted:#6B6B6B;--field:#FFFFFF;--err:#B3261E;--focus:#1B1B1B}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"new-cordial","Helvetica Neue",-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.hidden{display:none!important}
.stage{min-height:100%;display:grid;place-items:center;padding:32px 24px}
.panel{width:100%;max-width:720px;text-align:center}
form{max-width:440px;margin-left:auto;margin-right:auto}
.lock{width:44px;height:44px;margin:0 auto 28px;display:block}
h1{margin:0;font-weight:400;text-wrap:balance;font-size:clamp(2rem,5.2vw,2.75rem);line-height:1.1;letter-spacing:-.035em}
.sub{margin:12px 0 0;color:var(--muted);font-size:1.0625rem;letter-spacing:-.01em}
form{margin-top:56px}
.field{position:relative}
input[type=password],input[type=text]{width:100%;height:52px;border:0;border-radius:2px;background:var(--field);color:var(--ink);font:inherit;font-size:1rem;padding:0 60px 0 18px;box-shadow:0 10px 28px rgba(0,0,0,.07);appearance:none}
input::placeholder{color:#8A8A8A}
input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.go{position:absolute;right:0;top:0;width:60px;height:52px;display:grid;place-items:center;background:none;border:0;padding:0;cursor:pointer;color:#8A8A8A}
.go:hover{color:var(--ink)}
.go:focus-visible{outline:2px solid var(--focus);outline-offset:-4px;color:var(--ink)}
.go svg{width:34px;height:12px;display:block}
.msg{min-height:1.5rem;margin:14px 0 0;color:var(--err);font-size:.9375rem}
.shake{animation:shake .32s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
</style>
</head>
<body>
<div id="staticrypt_loading" class="stage" aria-live="polite"><span class="sub">Loading</span></div>
<main id="staticrypt_content" class="stage hidden">
  <div class="panel">
    <svg class="lock" viewBox="0 0 44 44" fill="none" stroke="#3A3A3A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M13 19v-6a9 9 0 0 1 18 0v6"/>
      <path d="M16 19v-6a6 6 0 0 1 12 0v6"/>
      <rect x="10" y="19" width="24" height="21" rx="3"/>
      <circle cx="22" cy="28" r="2.2"/>
      <path d="M22 30.2v3.3"/>
    </svg>
    <h1>This content is protected.</h1>
    <p class="sub">To view, please enter the password.</p>
    <form id="staticrypt-form" action="#" method="post">
      <div class="field">
        <label for="staticrypt-password" class="sr" style="position:absolute;left:-9999px">Password</label>
        <input id="staticrypt-password" type="password" name="password" placeholder="Enter password" autocomplete="current-password" autofocus>
        <button class="go" type="submit" aria-label="Unlock">
          <svg viewBox="0 0 34 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 6h31M27 1l5 5-5 5"/></svg>
        </button>
      </div>
      <p id="staticrypt-msg" class="msg" role="alert"></p>

};

document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
  e.preventDefault();
  const input = document.getElementById("staticrypt-password"),
        msg = document.getElementById("staticrypt-msg"),
        remember = false;
  msg.textContent = "";
  const { isSuccessful } = await staticrypt.handleDecryptionOfPage(input.value, remember);
  if (!isSuccessful) {
    msg.textContent = "That password is incorrect. Check it and try again.";
    input.select();
    input.classList.remove("shake"); void input.offsetWidth; input.classList.add("shake");
  }
});
</script>
</body>
